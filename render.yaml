# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: handoff-db
    plan: free
    databaseName: handoff
    user: handoff

services:
  - type: web
    name: handoff
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: handoff-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false        # Render asks for this when you create the Blueprint; leave blank for the rules engine
